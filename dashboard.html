<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your Dualcore Softworks project — sign in to see your submitted briefs and live progress.">
  <meta name="theme-color" content="#09090B">
  <title>My Projects — Dualcore Softworks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF0000'/%3E%3Cstop offset='1' stop-color='%23AF0404'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2309090B'/%3E%3Cpath d='M16 44V20l16 24V20' stroke='url(%23g)' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/wizard.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="wizard-body">

  <div class="site-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-aurora a1"></div>
    <div class="bg-aurora a2"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- Top bar -->
  <header class="w-topbar" id="wTopbar">
    <a href="index.html" class="brand" aria-label="Dualcore Softworks home">
      <span class="brand-mark">
        <svg viewBox="0 0 64 64" width="32" height="32"><defs><linearGradient id="wt-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF0000"/><stop offset="1" stop-color="#FF0000"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#414141"/><path d="M17 21v22l15-22v22" stroke="url(#wt-g)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">Dualcore<em>Softworks</em></span>
    </a>
    <div class="w-topbar-right">
      <span class="au-chip" id="authUserChip"></span>
      <a href="profile.html" class="au-chip au-chip-link" id="authProfileLink" aria-label="My profile" style="display:none"><span class="au-ico">U</span></a>
      <a href="start-project.html" class="btn btn-glass btn-sm" id="startProjectBtn">Start a Project</a>
      <button type="button" class="btn btn-ghost btn-sm" id="authLogout">Log out</button>
      <a href="index.html" class="btn btn-glass btn-sm">← Back to site</a>
    </div>
  </header>

  <!-- Dashboard -->
  <section class="dash-section" id="dashboard">
    <div class="container">
      <div class="dash-head">
        <div>
          <span class="eyebrow">Client Portal</span>
          <h1>My <span class="grad-text">Projects</span></h1>
          <p>Track every brief you've submitted — we update the status as your project moves forward.</p>
        </div>
        <div class="dash-actions">
          <button type="button" class="btn btn-ghost" id="dashRefresh">↻ Refresh</button>
          <a href="start-project.html" class="btn btn-primary magnetic">Start New Project <span class="btn-arrow">→</span></a>
        </div>
      </div>

      <div id="dashMsg" class="dash-msg" hidden>Loading your projects…</div>
      <div class="dash-grid" id="dashGrid"></div>
    </div>
  </section>

  <footer class="w-footer">
    <div class="container">
      <p>© <span id="year">2026</span> Dualcore Softworks · Engineering the future, one product at a time.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
